<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Відділ кадрів</title>
    <style>
        :root {
            --bg-color: #121212; --container-bg: #1e1e1e; --text-color: #f1f1f1;
            --border-color: #444; --accent-color: #bb86fc; --accent-hover: #9965f4;
            --error-color: #cf6679; --success-color: #03dac6;
        }
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 15px; font-size: 1.1rem; }
        .container { max-width: 900px; margin: 0 auto; background: var(--container-bg); padding: 25px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        
        h3 { border-bottom: 2px solid var(--border-color); padding-bottom: 8px; margin-top: 35px; color: var(--accent-color); font-size: 1.3rem;}
        .form-group { margin-bottom: 20px; width: 100%; }
        label { display: block; margin-bottom: 8px; font-weight: 500; }
        
        input, select { 
            width: 100%; padding: 12px; background: #2c2c2c; border: 2px solid var(--border-color); 
            color: var(--text-color); border-radius: 8px; font-size: 1.1rem; transition: 0.2s;
        }
        input:focus, select:focus { outline: none; border-color: var(--accent-color); }
        
        /* Checkboxes */
        .checkbox-group { display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 10px 0; }
        .checkbox-group input[type="checkbox"] {
            appearance: none; width: 28px; height: 28px; border: 2px solid var(--border-color);
            border-radius: 6px; background: #2c2c2c; cursor: pointer; position: relative; flex-shrink: 0;
        }
        .checkbox-group input[type="checkbox"]:checked { background: var(--accent-color); border-color: var(--accent-color); }
        .checkbox-group input[type="checkbox"]:checked::after {
            content: '✔'; color: #000; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); font-size: 18px; font-weight: bold;
        }

        .flex-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        
        /* Адаптивність для великих екранів */
        .desktop-row { display: flex; flex-direction: column; gap: 0; }
        @media (min-width: 768px) {
            .desktop-row { flex-direction: row; gap: 20px; align-items: flex-start; }
            .desktop-row .form-group { flex: 1; }
        }

        /* Buttons */
        button { background: var(--accent-color); color: #000; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1.1rem; transition: 0.2s; }
        button:hover { background: var(--accent-hover); transform: scale(0.98); }
        .btn-remove { background: var(--error-color); color: #fff; margin-top: 15px; }
        .btn-remove:hover { background: #b05263; }

        .hidden { display: none !important; }
        .dynamic-block { border: 2px dashed var(--border-color); padding: 20px; margin-bottom: 20px; border-radius: 8px; background: #242424;}
        
        .valid { border-color: var(--success-color) !important; }
        .invalid { border-color: var(--error-color) !important; }
        #pageLoader { padding: 15px; background: #333; color: #fff; text-align: center; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <button id="tabGuest" onclick="switchTab('guest')" style="flex:1;">Гість</button>
        <button id="tabAdmin" onclick="switchTab('admin')" style="flex:1; background:#444; color:#fff;">Адмін</button>
    </div>

    <div id="pageLoader">Завантаження бази населених пунктів та кодів...</div>

    <!-- Datalists для динамічного пошуку -->
    <datalist id="citiesList"></datalist>
    <datalist id="centersList"></datalist>
    <datalist id="countriesList"></datalist>
    <datalist id="yearsList"></datalist>

    <!-- Вкладка ГІСТЬ -->
    <div id="guest">
        <form id="hrForm" onsubmit="submitForm(event)">
            
            <h3>Загальні відомості</h3>
            <div class="desktop-row">
                <div class="form-group">
                    <label>Розряд робітника</label>
                    <select name="rank">
                        <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                        <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Телефон (основний)</label>
                    <div class="flex-row" style="flex-wrap: nowrap;">
                        <input type="text" list="countriesList" name="mainPhoneCode" placeholder="Країна..." style="width: 140px;" autocomplete="off">
                        <input type="text" name="mainPhone" oninput="validateNumber(this, 15)" placeholder="Номер..." autocomplete="off">
                    </div>
                </div>
            </div>
            
            <div class="form-group">
                <label>Прізвище, ім'я та по батькові</label>
                <input type="text" name="fullName" oninput="formatName(this)" required placeholder="Іванов Іван Іванович">
            </div>

            <h3>Робочий стаж</h3>
            <label class="checkbox-group">
                <input type="checkbox" id="hasWorked" onchange="toggleBlock('hasWorked', 'workYes', 'workNo')">
                <span>Чи працювала людина до цього?</span>
            </label>
            
            <div id="workYes" class="hidden dynamic-block desktop-row">
                <div class="form-group"><label>Індекс (5 цифр)</label><input type="text" name="prevZip" oninput="validateNumber(this, 5)"></div>
                <div class="form-group">
                    <label>Населений пункт компанії</label>
                    <input type="text" list="citiesList" name="prevCity" placeholder="Введіть або виберіть місто..." autocomplete="off">
                </div>
            </div>
            
            <div id="workNo" class="dynamic-block">
                <div class="form-group">
                    <label>Центр зайнятості</label>
                    <input type="text" list="centersList" name="employmentCenter" placeholder="Введіть або виберіть центр..." autocomplete="off">
                </div>
            </div>

            <div class="desktop-row">
                <div class="form-group">
                    <label>Наявність пільгових категорій</label>
                    <select name="hasPrivileges" onchange="toggleBlockVal(this, 'Так', 'privilegesDetails')">
                        <option value="Ні">Ні</option><option value="Так">Так</option>
                    </select>
                </div>
            </div>

            <div id="privilegesDetails" class="hidden dynamic-block desktop-row">
                <div class="form-group"><label>Дата надання пільгової категорії</label><div class="custom-date flex-row"></div></div>
                <div class="form-group">
                    <label>Термін дії</label>
                    <select name="privilegeDuration"><option>1 рік</option><option>3 роки</option><option>5 років</option><option>безтерміново</option></select>
                </div>
            </div>

            <h3>Паспортні дані та ІПН</h3>
            <div class="desktop-row" style="align-items: center;">
                <div class="form-group" id="innBlock">
                    <label>ІПН (10 цифр)</label>
                    <input type="text" id="innInput" name="inn" oninput="validateINN(this)" maxlength="10" placeholder="1234567890">
                </div>
                <label class="checkbox-group" style="padding-top: 15px;">
                    <input type="checkbox" id="noInn" onchange="toggleInn()">
                    <span>Немає ІПН (через релігійні переконання)</span>
                </label>
            </div>
            
            <div class="form-group hidden" id="dobBlock">
                <label style="color:var(--accent-color);">Дата народження (замість ІПН)</label>
                <div class="custom-date flex-row"></div>
            </div>

            <div class="form-group">
                <label>Вид паспорту</label>
                <select name="passportType" onchange="togglePassport(this)">
                    <option value="id">ID-картка</option>
                    <option value="paper">Паперовий (Книжечка)</option>
                </select>
            </div>

            <div id="idCardFields" class="dynamic-block">
                <div class="desktop-row">
                    <div class="form-group"><label>Номер паспорта (9 цифр)</label><input type="text" name="idNumber" oninput="validateNumber(this, 9)"></div>
                    <div class="form-group"><label>Орган, що видав (4 цифри)</label><input type="text" name="idAuthority" oninput="validateNumber(this, 4)"></div>
                </div>
                <div class="desktop-row">
                    <div class="form-group"><label>Дата видачі</label><div class="custom-date flex-row"></div></div>
                    <div class="form-group"><label>Дата закінчення</label><div class="custom-date flex-row"></div></div>
                </div>
            </div>

            <div id="paperCardFields" class="hidden dynamic-block">
                <div class="desktop-row">
                    <div class="form-group">
                        <label>Серія та Номер</label>
                        <div class="flex-row" style="flex-wrap: nowrap;">
                            <input type="text" name="paperSeries" style="width:70px; text-align:center;" placeholder="АА" oninput="validateCyrillic(this, 2, 'paperNum')" id="paperSer">
                            <input type="text" name="paperNumber" style="flex:1; letter-spacing:2px;" placeholder="123456" oninput="validateNumber(this, 6)" id="paperNum">
                        </div>
                    </div>
                    <div class="form-group"><label>Орган, що видав</label><input type="text" name="paperAuthority"></div>
                </div>
                <div class="form-group"><label>Дата видачі</label><div class="custom-date flex-row" style="width: 100%; max-width: 400px;"></div></div>
            </div>

            <h3>Освіта</h3>
            <div class="desktop-row">
                <div class="form-group"><label>Рівень освіти</label>
                    <select name="educationLevel">
                        <option>Базова загальна середня</option><option>Повна загальна середня</option>
                        <option>Молодший спеціаліст</option><option>Бакалавр</option><option>Магістр</option>
                    </select>
                </div>
                <div class="form-group"><label>Рік закінчення</label>
                    <input type="text" list="yearsList" name="gradYear" placeholder="Оберіть або введіть рік..." autocomplete="off">
                </div>
            </div>
            <div class="desktop-row">
                <div class="form-group"><label>Навчальний заклад</label><input type="text" name="university"></div>
                <div class="form-group"><label>Населений пункт закладу</label><input type="text" list="citiesList" name="universityCity" autocomplete="off"></div>
            </div>

            <h3>Демографічні дані та Сімейний стан</h3>
            <div class="form-group"><label>Місце народження</label><input type="text" list="citiesList" name="birthPlace" autocomplete="off"></div>
            <div class="form-group"><label>Сімейний стан</label><select name="maritalStatus"><option>Одружений/Заміжня</option><option>Неодружений/Незаміжня</option></select></div>
            
            <div id="relativesContainer"></div>
            <button type="button" onclick="addRelative()" style="background: transparent; border: 2px solid var(--accent-color); color: var(--text-color);">+ Додати родича</button>

            <h3>Додатково (Періоди роботи)</h3>
            <div id="periodsContainer"></div>
            <button type="button" onclick="addPeriod()" style="background: transparent; border: 2px solid var(--accent-color); color: var(--text-color);">+ Додати період роботи</button>

            <label class="checkbox-group" style="margin-top:25px;">
                <input type="checkbox" id="hasPrivilegeWork" onchange="toggleBlock('hasPrivilegeWork', 'privilegePeriodsWrapper')">
                <span>Чи працювала людина на пільгових умовах?</span>
            </label>
            <div id="privilegePeriodsWrapper" class="hidden">
                <div id="privilegePeriodsContainer"></div>
                <button type="button" onclick="addPrivilegePeriod()" style="background: transparent; border: 2px solid var(--accent-color); color: var(--text-color);">+ Додати пільговий період</button>
            </div>

            <hr style="border-color: #444; margin: 40px 0;">
            <button type="submit" id="submitBtn" style="width:100%; padding: 18px; font-size: 1.3rem;">Підтвердити та зберегти</button>
        </form>
    </div>

    <!-- Вкладка АДМІН -->
    <div id="admin" class="hidden">
        <div id="loginScreen">
            <h3>Вхід в адмін-панель</h3>
            <div class="form-group"><label>Логін</label><input type="text" id="adminLogin"></div>
            <div class="form-group"><label>Пароль</label><input type="password" id="adminPass"></div>
            <button onclick="checkAdmin()">Увійти</button>
        </div>
        <div id="adminDashboard" class="hidden">
            <button onclick="fetchAdminData()" style="margin-bottom: 20px;">Оновити базу</button>
            <div id="adminDataContainer"></div>
        </div>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-7y6K7CPGSWbfVZLPTR7qwthwWj-7Lcrk8mNABjThJBpJCO6fsYtUQUqWTAKZdB8s/exec";

    window.onload = async function() {
        populateYears();
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL + "?action=getOptions");
            const data = await res.json();
            
            fillDatalist('citiesList', data.cities);
            fillDatalist('centersList', data.centers);
            fillDatalist('countriesList', data.countries);
            
            document.getElementById('pageLoader').classList.add('hidden');
        } catch (e) {
            document.getElementById('pageLoader').innerText = "Помилка завантаження бази даних.";
        }
        initAllDates();
    };

    function populateYears() {
        const yearList = document.getElementById('yearsList');
        const currYear = new Date().getFullYear();
        for(let i = currYear; i >= 1950; i--) {
            yearList.innerHTML += `<option value="${i}">`;
        }
    }

    function fillDatalist(id, arr) {
        document.getElementById(id).innerHTML = arr.map(item => `<option value="${item}">`).join('');
    }

    function switchTab(tabId) {
        document.getElementById('guest').classList.add('hidden');
        document.getElementById('admin').classList.add('hidden');
        document.getElementById(tabId).classList.remove('hidden');
        document.getElementById('tabGuest').style.background = tabId === 'guest' ? 'var(--accent-color)' : '#444';
        document.getElementById('tabGuest').style.color = tabId === 'guest' ? '#000' : '#fff';
        document.getElementById('tabAdmin').style.background = tabId === 'admin' ? 'var(--accent-color)' : '#444';
        document.getElementById('tabAdmin').style.color = tabId === 'admin' ? '#000' : '#fff';
    }

    function toggleBlock(checkboxId, showId, hideId) {
        const isChecked = document.getElementById(checkboxId).checked;
        if(document.getElementById(showId)) document.getElementById(showId).classList.toggle('hidden', !isChecked);
        if(hideId && document.getElementById(hideId)) document.getElementById(hideId).classList.toggle('hidden', isChecked);
    }
    
    function toggleBlockVal(selectEl, val, targetId) {
        document.getElementById(targetId).classList.toggle('hidden', selectEl.value !== val);
    }
    
    function togglePassport(el) {
        document.getElementById('idCardFields').classList.toggle('hidden', el.value !== 'id');
        document.getElementById('paperCardFields').classList.toggle('hidden', el.value !== 'paper');
    }

    function toggleInn() {
        const isChecked = document.getElementById('noInn').checked;
        const innInput = document.getElementById('innInput');
        document.getElementById('dobBlock').classList.toggle('hidden', !isChecked);
        
        if (isChecked) {
            innInput.value = '';
            innInput.disabled = true;
            innInput.classList.remove('invalid', 'valid');
            innInput.removeAttribute('required');
        } else {
            innInput.disabled = false;
            innInput.setAttribute('required', 'true');
        }
    }

    function formatName(input) {
        let val = input.value.replace(/[^А-Яа-яІіЇїЄєҐґ'\-\s]/gi, '');
        let words = val.split(/\s+/);
        if (words.length > 0 && words[0]) words[0] = words[0].toUpperCase();
        for (let i = 1; i < words.length; i++) {
            if(words[i]) words[i] = words[i].charAt(0).toUpperCase() + words[i].slice(1).toLowerCase();
        }
        input.value = words.join(" ");
    }

    function validateNumber(input, maxLen, nextId = null) {
        input.value = input.value.replace(/\D/g, '');
        if (input.value.length > maxLen) input.value = input.value.slice(0, maxLen);
        if (input.value.length === maxLen && nextId) document.getElementById(nextId)?.focus();
    }

    function validateCyrillic(input, maxLen, nextId = null) {
        input.value = input.value.replace(/[^А-Яа-яІіЇїЄєҐґ]/gi, '').toUpperCase();
        if (input.value.length > maxLen) input.value = input.value.slice(0, maxLen);
        if (input.value.length === maxLen && nextId) document.getElementById(nextId)?.focus();
    }

    function validateINN(input) {
        if(document.getElementById('noInn').checked) return;
        validateNumber(input, 10);
        const val = input.value;
        if (val.length < 10) { input.className = 'invalid'; return; }
        const weights = [-1, 5, 7, 9, 4, 6, 10, 5, 7];
        let sum = 0;
        for (let i = 0; i < 9; i++) sum += parseInt(val[i]) * weights[i];
        input.className = ((sum % 11) % 10 === parseInt(val[9])) ? 'valid' : 'invalid';
    }

    // Дати
    const monthsUa = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
    
    function initAllDates() {
        document.querySelectorAll('.custom-date').forEach(container => buildDateSelector(container));
    }
    
    function buildDateSelector(container, onlyMonthYear = false) {
        if(container.innerHTML.trim() !== '') return;
        
        let html = '';
        if(!onlyMonthYear) html += `<select class="d-day" style="width:70px; flex-shrink: 0;"></select>`;
        html += `<select class="d-month" style="flex:1; min-width: 120px;">${monthsUa.map((m,i)=>`<option value="${i}">${m}</option>`).join('')}</select>
                 <select class="d-year" style="width:90px; flex-shrink: 0;"></select>`;
        container.innerHTML = html;

        const yearSel = container.querySelector('.d-year');
        const currYear = new Date().getFullYear();
        for(let i = currYear + 10; i >= 1950; i--) yearSel.innerHTML += `<option value="${i}" ${i===currYear?'selected':''}>${i}</option>`;

        if(!onlyMonthYear) {
            container.querySelector('.d-month').addEventListener('change', () => updateDays(container));
            yearSel.addEventListener('change', () => updateDays(container));
            updateDays(container);
        }
    }

    function updateDays(container) {
        const daySel = container.querySelector('.d-day');
        const month = parseInt(container.querySelector('.d-month').value);
        const year = parseInt(container.querySelector('.d-year').value);
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        const currDay = daySel.value || 1;
        daySel.innerHTML = '';
        for(let i=1; i<=daysInMonth; i++) {
            // Додаємо провідний нуль для чисел 1-9
            let displayDay = i.toString().padStart(2, '0');
            daySel.innerHTML += `<option value="${i}" ${i==currDay?'selected':''}>${displayDay}</option>`;
        }
    }

    // Динамічні блоки
    let blockCounter = 0;
    function addRelative() {
        blockCounter++;
        const id = 'rel_' + blockCounter;
        const html = `
            <div class="dynamic-block" id="${id}">
                <div class="desktop-row">
                    <div class="form-group"><label>Ступінь спорідненості</label><select><option>Дружина/Чоловік</option><option>Син/Донька</option></select></div>
                    <div class="form-group"><label>ПІБ родича</label><input type="text" oninput="formatName(this)" placeholder="ІВАНОВ Іван Іванович"></div>
                </div>
                <div class="desktop-row">
                    <div class="form-group"><label>Рік народження</label><input type="text" list="yearsList" autocomplete="off"></div>
                    <div class="form-group">
                        <label>Телефон родича</label>
                        <div class="flex-row" style="flex-wrap: nowrap;">
                            <input type="text" list="countriesList" placeholder="Країна..." style="width: 140px;" autocomplete="off">
                            <input type="text" oninput="validateNumber(this, 15)" placeholder="Номер...">
                        </div>
                    </div>
                </div>
                <button type="button" class="btn-remove" onclick="document.getElementById('${id}').remove()">Видалити</button>
            </div>`;
        document.getElementById('relativesContainer').insertAdjacentHTML('beforeend', html);
    }

    function addPeriod() {
        const id = 'per_' + Date.now();
        const html = `
            <div class="dynamic-block desktop-row" id="${id}">
                <div class="form-group"><label>З дати:</label><div class="custom-date flex-row"></div></div>
                <div class="form-group"><label>По дату:</label><div class="custom-date flex-row"></div></div>
                <div style="display:flex; align-items:flex-end; padding-bottom:20px;">
                    <button type="button" class="btn-remove" style="margin:0;" onclick="document.getElementById('${id}').remove()">✕</button>
                </div>
            </div>`;
        document.getElementById('periodsContainer').insertAdjacentHTML('beforeend', html);
        document.querySelectorAll(`#${id} .custom-date`).forEach(c => buildDateSelector(c));
    }

    function addPrivilegePeriod() {
        const id = 'priv_' + Date.now();
        const html = `
            <div class="dynamic-block desktop-row" id="${id}">
                <div class="form-group"><label>З (Місяць/Рік):</label><div class="custom-date flex-row priv-date"></div></div>
                <div class="form-group"><label>По (Місяць/Рік):</label><div class="custom-date flex-row priv-date"></div></div>
                <div class="form-group"><label>Область</label><input type="text" list="citiesList" autocomplete="off"></div>
                <div style="display:flex; align-items:flex-end; padding-bottom:20px;">
                    <button type="button" class="btn-remove" style="margin:0;" onclick="document.getElementById('${id}').remove()">✕</button>
                </div>
            </div>`;
        document.getElementById('privilegePeriodsContainer').insertAdjacentHTML('beforeend', html);
        document.querySelectorAll(`#${id} .priv-date`).forEach(c => buildDateSelector(c, true));
    }

    async function submitForm(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.innerText = "Відправка..."; btn.disabled = true;

        const fullName = document.querySelector('[name="fullName"]').value;
        const excelString = "Дані: " + fullName; 

        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST", headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ fullName: fullName, excelString: excelString })
            });
            alert("Анкету успішно збережено!");
            document.getElementById('hrForm').reset();
            window.location.reload();
        } catch (err) { alert("Помилка відправки."); }
        btn.innerText = "Підтвердити та зберегти"; btn.disabled = false;
    }

    function checkAdmin() {
        if (document.getElementById('adminLogin').value === '0000' && document.getElementById('adminPass').value === '1111') {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('adminDashboard').classList.remove('hidden');
            fetchAdminData();
        } else alert('Помилка входу');
    }

    async function fetchAdminData() {
        const cont = document.getElementById('adminDataContainer');
        cont.innerHTML = "Завантаження...";
        try {
            const res = await fetch(GOOGLE_SCRIPT_URL);
            const data = await res.json();
            cont.innerHTML = data.length ? data.reverse().map(r => `
                <div class="dynamic-block" style="display:flex; justify-content:space-between; align-items: center;">
                    <div><b>${r[1]}</b><br><small style="color:var(--accent-color)">${new Date(r[0]).toLocaleString('uk-UA')}</small></div>
                    <button onclick="navigator.clipboard.writeText('${r[2]}'); alert('Скопійовано!')">Копіювати</button>
                </div>
            `).join('') : "База порожня.";
        } catch(e) { cont.innerHTML = "Помилка."; }
    }
</script>

</body>
</html>
